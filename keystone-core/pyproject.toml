[project]
name = "keystone-core"
version = "0.1.0"
description = "Librairie cœur de Keystone."
readme = "README.md"
authors = [
    { name = "Hassane KARKACH", email = "karkach.hassane@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "jsonschema>=4.26.0",
    "rfc3339-validator>=0.1.4",
    "rfc3986-validator>=0.1.1",
    "ruamel-yaml>=0.19.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
